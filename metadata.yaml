short-description: "分析云图行业榜单、品牌、人群与素材内容，生成可审计的行业内容经营报告"
tags:
  - 云图
compatibility:
  - data-analysis
  - python
  - html-report
requires:
  env:
    - ENV_BACKEND_HOST
    - YUCE_AUTHORIZATION
    - YUCE_SESSION_ID
    - YCSESSIONID
market:
  title: "云图素材全景诊断"
  summary: "按行业、周期、榜单、品牌和人群分析云图内容，拆解素材表现、脚本、人群与高光时刻，生成可审计的行业内容经营报告，并支持进一步提炼选题与创作策略。"
  category:
    key: short_video_content
    label: 短视频内容
  badges:
    - label: 云图
      tone: blue
  examples:
    - title: 行业内容榜单
      prompt: "洞察食品饮料行业近7天的内容趋势，拆解 TOP10 优质素材"
    - title: 品牌对比
      prompt: "对比指定品牌的内容表现与创作打法，提炼差异化机会"
    - title: 高光帧分析
      prompt: "识别云图优质素材的点击与互动高光时刻，辅助优化创作"
skill_form:
  - key: industry
    type: input
    label: 行业
    description: 输入云图行业名称，例如食品饮料
    placeholder: "例如：食品饮料"
    required: true

  - key: date_range
    type: daterange
    label: 分析周期
    description: 结束日期不得晚于采集当天前 3 天，分析周期最多 45 天，起止日期均为 YYYY-MM-DD
    placeholder: "开始日期,结束日期"
    format: YYYY-MM-DD
    value_format: YYYY-MM-DD
    required: true

  - key: ranking_metric
    type: select
    label: 榜单截取方式
    description: 选择远端榜单指标，候选池固定为 TOP1000
    required: true
    default: EXPOSURE_TOP1000
    options:
      - label: 曝光量 TOP1000
        value: EXPOSURE_TOP1000
      - label: CTR TOP1000
        value: CTR_TOP1000
      - label: 互动率 TOP1000
        value: INTERACTION_RATE_TOP1000
      - label: 完播率 TOP1000
        value: COMPLETION_RATE_TOP1000

  - key: brand_scope
    type: select
    label: 全行业/指定品牌
    description: 全行业或按指定品牌筛选
    required: true
    default: ALL_INDUSTRY
    options:
      - label: 全行业
        value: ALL_INDUSTRY
      - label: 指定品牌
        value: SPECIFIED_BRANDS

  - key: brands
    type: textarea
    label: 品牌名称
    description: 仅在指定品牌时填写 3 至 10 个品牌，用英文逗号分隔
    placeholder: "小仙炖,燕之屋,五个女博士"
    required: true
    rows: 2
    max_length: 200
    visible_when:
      field: brand_scope
      equals: SPECIFIED_BRANDS
    depends_on:
      brand_scope: SPECIFIED_BRANDS

  - key: ages
    type: checkbox
    label: 年龄筛选
    description: 可选；多选年龄段，留空不过滤
    options:
      - label: 18-19 岁
        value: AGE_18_19
      - label: 20-23 岁
        value: AGE_20_23
      - label: 24-30 岁
        value: AGE_24_30
      - label: 31-35 岁
        value: AGE_31_35
      - label: 36-40 岁
        value: AGE_36_40
      - label: 41-45 岁
        value: AGE_41_45
      - label: 46-50 岁
        value: AGE_46_50
      - label: 51-55 岁
        value: AGE_51_55
      - label: 56-59 岁
        value: AGE_56_59
      - label: 60 岁以上
        value: AGE_60_PLUS
    required: false

  - key: genders
    type: checkbox
    label: 性别筛选
    description: 可选；多选性别，留空不过滤
    options:
      - label: 男性
        value: MALE
      - label: 女性
        value: FEMALE
    required: false

  - key: crowd_groups
    type: checkbox
    label: 八大人群筛选
    description: 可选；多选八大人群，留空不过滤
    options:
      - label: 小镇青年
        value: TOWN_YOUTH
      - label: Gen Z
        value: GENZ
      - label: 中老年
        value: SENIOR_MIDDLE
      - label: 精致妈妈
        value: REFINED_MOM
      - label: 新白领
        value: NEW_WHITE_COLLAR
      - label: 都市银发
        value: URBAN_SILVER
      - label: 小镇中老年
        value: TOWN_MIDDLE_ELDER
      - label: 都市蓝领
        value: URBAN_BLUE_COLLAR
    required: false

  - key: material_list
    type: textarea
    label: 筛选与排序条件
    description: 可选；用自然语言描述筛选条件和排序方向，技能会在完整 TOP1000 落盘后转换并本地执行，不改变远端榜单参数
    placeholder: '例如：先落盘完整TOP1000后按“曝光量”>=1000000且“视频标题”包含“燕窝”，再按“互动率”降序'
    required: false
    rows: 3
    max_length: 4000

  - key: detail_top_n
    type: number
    label: 详情素材数
    description: 默认 10；详情请求包含秒级拆解和内容公式字段；如同时生成高光帧图片，再按下方规则提取高光帧图片
    required: true
    default: 10
    min: 1
    max: 1000
    step: 1
    precision: 0
    addon_after: 条

  - key: highlight_mode
    type: select
    label: 是/否
    description: 选择否时，以下高光帧字段不参与填写；选择是时，至少选择一个高光指标
    required: true
    default: "off"
    options:
      - label: 否
        value: "off"
      - label: 是
        value: "on"

  - key: highlight_include_cover
    type: select
    label: 是/否
    description: 选择是时决定是否把视频封面加入高光帧结果
    required: true
    default: "true"
    options:
      - label: 是
        value: "true"
      - label: 否
        value: "false"
    visible_when:
      field: highlight_mode
      equals: "on"
    depends_on:
      highlight_mode: "on"

  - key: highlight_like_enabled
    type: select
    label: 是否选择
    required: true
    default: "false"
    options:
      - label: 是
        value: "true"
      - label: 否
        value: "false"
    visible_when:
      field: highlight_mode
      equals: "on"
    depends_on:
      highlight_mode: "on"
  - key: highlight_like_strategy
    type: select
    label: 局部峰值/最高值
    options:
      - label: 局部峰值
        value: local_peaks
      - label: 最高值
        value: global_top_values
    default: local_peaks
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_like_enabled: "true"
  - key: highlight_like_limit
    type: number
    label: 帧数
    default: 2
    min: 1
    step: 1
    precision: 0
    addon_after: 帧
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_like_enabled: "true"

  - key: highlight_loss_enabled
    type: select
    label: 是否选择
    required: true
    default: "false"
    options:
      - label: 是
        value: "true"
      - label: 否
        value: "false"
    visible_when:
      field: highlight_mode
      equals: "on"
    depends_on:
      highlight_mode: "on"
  - key: highlight_loss_strategy
    type: select
    label: 局部峰值/最高值
    options:
      - label: 局部峰值
        value: local_peaks
      - label: 最高值
        value: global_top_values
    default: local_peaks
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_loss_enabled: "true"
  - key: highlight_loss_limit
    type: number
    label: 帧数
    default: 2
    min: 1
    step: 1
    precision: 0
    addon_after: 帧
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_loss_enabled: "true"

  - key: highlight_click_enabled
    type: select
    label: 是否选择
    required: true
    default: "false"
    options:
      - label: 是
        value: "true"
      - label: 否
        value: "false"
    visible_when:
      field: highlight_mode
      equals: "on"
    depends_on:
      highlight_mode: "on"
  - key: highlight_click_strategy
    type: select
    label: 局部峰值/最高值
    options:
      - label: 局部峰值
        value: local_peaks
      - label: 最高值
        value: global_top_values
    default: local_peaks
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_click_enabled: "true"
  - key: highlight_click_limit
    type: number
    label: 帧数
    default: 2
    min: 1
    step: 1
    precision: 0
    addon_after: 帧
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_click_enabled: "true"

  - key: highlight_interaction_enabled
    type: select
    label: 是否选择
    required: true
    default: "false"
    options:
      - label: 是
        value: "true"
      - label: 否
        value: "false"
    visible_when:
      field: highlight_mode
      equals: "on"
    depends_on:
      highlight_mode: "on"
  - key: highlight_interaction_strategy
    type: select
    label: 局部峰值/最高值
    options:
      - label: 局部峰值
        value: local_peaks
      - label: 最高值
        value: global_top_values
    default: local_peaks
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_interaction_enabled: "true"
  - key: highlight_interaction_limit
    type: number
    label: 帧数
    default: 2
    min: 1
    step: 1
    precision: 0
    addon_after: 帧
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_interaction_enabled: "true"

  - key: highlight_comment_enabled
    type: select
    label: 是否选择
    required: true
    default: "false"
    options:
      - label: 是
        value: "true"
      - label: 否
        value: "false"
    visible_when:
      field: highlight_mode
      equals: "on"
    depends_on:
      highlight_mode: "on"
  - key: highlight_comment_strategy
    type: select
    label: 局部峰值/最高值
    options:
      - label: 局部峰值
        value: local_peaks
      - label: 最高值
        value: global_top_values
    default: local_peaks
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_comment_enabled: "true"
  - key: highlight_comment_limit
    type: number
    label: 帧数
    default: 2
    min: 1
    step: 1
    precision: 0
    addon_after: 帧
    required: true
    depends_on:
      highlight_mode: "on"
      highlight_comment_enabled: "true"
